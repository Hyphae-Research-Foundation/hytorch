[workspace]
resolver = "2"
members = ["crates/apply-ref", "crates/binding-wire", "crates/verifier", "crates/seam"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Hyphae-Research-Foundation/hytorch"

[profile.release]
# Reproducible, verifiable builds: no LTO surprises, no codegen-units races.
lto = false
codegen-units = 1
panic = "abort"
