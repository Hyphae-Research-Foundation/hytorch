name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  rust:
    name: cargo test (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - run: cargo test --workspace --release
      - uses: actions/upload-artifact@v4
        with:
          name: reference-binaries
          path: |
            target/release/libapply_ref.so
            target/release/hytorch-seam
            target/release/hytorch-verify
            target/release/hytorch-ledger-query
  python-cpu-gates:
    name: CPU gates (spill, seam, injection, runtime, two-phase)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch && pip install numpy pytest
      - run: cargo build --workspace --release
      - name: two-phase gate (G1–G7)
        run: cd python && python -m pytest -q tests/test_two_phase.py
      - name: spill round-trip, e2e seam, fault injection, journaled runtime
        run: cd python && python -m pytest -q tests/test_spill_roundtrip.py tests/test_e2e_seam.py tests/test_inject.py tests/test_runtime.py
